name: Publish

on:
  release:
    types: [created]

jobs:

  publish-github:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
        with:
          ref: ${{ github.ref }}
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@0f62d2ad8407a414cddd4790bed06fd9ebda0f56 # v1
        with:
          java-version: 8

      - name: Check
        uses: eskatos/gradle-command-action@b3afdc78a7849557ab26e243ccf07548086da025 # v1
        with:
          arguments: check

      - name: Build
        uses: eskatos/gradle-command-action@b3afdc78a7849557ab26e243ccf07548086da025 # v1
        with:
          arguments: build

      - name: Upload Jars
        id: upload-release-asset
        uses: svenstaro/upload-release-action@v1-release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file: ./build/libs/*.jar
          file_glob: true

  publish-gcp-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
        with:
          ref: ${{ github.ref }}
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@0f62d2ad8407a414cddd4790bed06fd9ebda0f56 # v1
        with:
          java-version: 8

      - name: Check
        uses: eskatos/gradle-command-action@b3afdc78a7849557ab26e243ccf07548086da025 # v1
        with:
          arguments: check

      - name: Setup GCP
        uses: google-github-actions/setup-gcloud@20c93dacc1d70ddbce76c63ab32c35595345bdd1 # v0
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_ARTIFACTS_KEY }}
          export_default_credentials: true

      - name: Upload to GCP
        uses: eskatos/gradle-command-action@b3afdc78a7849557ab26e243ccf07548086da025 # v1
        with:
          arguments: publish
        env:
          ENABLE_GCP: true